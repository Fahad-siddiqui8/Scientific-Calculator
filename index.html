<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantumCalc - Scientific Calculator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font (Inter & JetBrains Mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        glass: {
                            100: 'rgba(255, 255, 255, 0.05)',
                            200: 'rgba(255, 255, 255, 0.1)',
                            300: 'rgba(255, 255, 255, 0.15)',
                            border: 'rgba(255, 255, 255, 0.12)',
                        },
                        accent: {
                            cyan: '#00f2fe',
                            blue: '#4facfe',
                            purple: '#7f00ff',
                            pink: '#e100ff',
                            orange: '#ff8c00'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background: radial-gradient(circle at 20% 20%, #0f172a 0%, #090d16 50%, #04060a 100%);
            min-height: 100vh;
        }

        /* Glassmorphism utility */
        .glass-card {
            background: rgba(18, 26, 43, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(4px);
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .glass-btn:active {
            transform: translateY(1px);
            background: rgba(255, 255, 255, 0.15);
        }

        /* Button Variant Styling */
        .btn-operator {
            background: rgba(79, 172, 254, 0.12);
            color: #60a5fa;
            border-color: rgba(96, 165, 250, 0.25);
        }
        .btn-operator:hover {
            background: rgba(79, 172, 254, 0.25);
            color: #93c5fd;
        }

        .btn-function {
            background: rgba(168, 85, 247, 0.12);
            color: #c084fc;
            border-color: rgba(192, 132, 252, 0.2);
        }
        .btn-function:hover {
            background: rgba(168, 85, 247, 0.25);
            color: #e9d5ff;
        }

        .btn-action {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border-color: rgba(248, 113, 113, 0.25);
        }
        .btn-action:hover {
            background: rgba(239, 68, 68, 0.28);
            color: #fca5a5;
        }

        .btn-equal {
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            color: #ffffff;
            border: none;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
        }
        .btn-equal:hover {
            background: linear-gradient(135deg, #00d4ff 0%, #0080ff 100%);
            box-shadow: 0 6px 20px rgba(0, 114, 255, 0.6);
            color: #fff;
        }

        .btn-toggle-active {
            background: rgba(255, 255, 255, 0.25) !important;
            border-color: rgba(255, 255, 255, 0.4) !important;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        /* Ripple effect */
        .ripple {
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-animation 0.4s linear;
            background-color: rgba(255, 255, 255, 0.3);
            pointer-events: none;
        }
        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Pulsing Glow Background Orbs */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.35;
            pointer-events: none;
        }
    </style>
</head>
<body class="flex items-center justify-center p-3 sm:p-6 text-slate-100 font-sans relative overflow-x-hidden min-h-screen">

    <!-- Background Decorative Ambient Glows -->
    <div class="glow-orb w-96 h-96 bg-blue-600 top-[-50px] left-[-100px]"></div>
    <div class="glow-orb w-96 h-96 bg-purple-600 bottom-[-50px] right-[-100px]"></div>

    <!-- Main Container -->
    <div class="w-full max-w-5xl z-10 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        
        <!-- Calculator Main Card -->
        <div class="lg:col-span-8 glass-card rounded-3xl p-4 sm:p-6 shadow-2xl relative">
            
            <!-- Header Bar -->
            <div class="flex items-center justify-between mb-4 pb-3 border-b border-white/10">
                <div class="flex items-center space-x-3">
                    <div class="w-3 h-3 rounded-full bg-red-500"></div>
                    <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                    <div class="w-3 h-3 rounded-full bg-green-500"></div>
                    <span class="text-xs font-mono text-slate-400 tracking-wider ml-2 uppercase">QuantumCalc FX-99</span>
                </div>

                <!-- Status Indicators -->
                <div class="flex items-center space-x-3 text-xs font-mono">
                    <span id="deg-rad-indicator" class="px-2 py-0.5 rounded bg-blue-500/20 text-blue-400 border border-blue-500/30 font-semibold">DEG</span>
                    <span id="shift-indicator" class="px-2 py-0.5 rounded bg-purple-500/10 text-slate-500 border border-purple-500/10 transition-colors duration-200">2ND</span>
                    <button id="toggle-history-mobile" class="lg:hidden p-1.5 rounded-lg bg-white/5 hover:bg-white/10 text-slate-300">
                        <i class="fas fa-history"></i>
                    </button>
                </div>
            </div>

            <!-- Display Screen -->
            <div class="bg-slate-950/70 border border-white/10 rounded-2xl p-4 mb-5 shadow-inner relative flex flex-col justify-between min-h-[110px]">
                
                <!-- History / Formula Line -->
                <div id="expression-display" class="font-mono text-slate-400 text-sm sm:text-base text-right overflow-x-auto whitespace-nowrap min-h-[24px] tracking-wide scrollbar-none">
                    <!-- Dynamic Content -->
                </div>

                <!-- Main Input & Live Result Line -->
                <div class="flex items-baseline justify-between mt-2 gap-2">
                    <div id="error-badge" class="text-xs font-mono text-red-400 bg-red-500/10 px-2 py-0.5 rounded border border-red-500/20 hidden">ERROR</div>
                    <div id="main-display" class="font-mono text-2xl sm:text-4xl text-right font-semibold text-white tracking-normal ml-auto overflow-x-auto whitespace-nowrap scrollbar-none w-full">
                        0
                    </div>
                </div>

                <!-- Live Result Sub-preview -->
                <div id="live-preview" class="font-mono text-xs sm:text-sm text-right text-cyan-400/70 min-h-[18px]">
                    = 0
                </div>
            </div>

            <!-- Keypad Grid -->
            <div class="grid grid-cols-5 sm:grid-cols-6 gap-2 sm:gap-2.5">

                <!-- Row 1: Toggles & Special Controls -->
                <button data-action="toggle-deg" class="glass-btn btn-function rounded-xl p-2.5 text-xs sm:text-sm font-semibold">DEG/RAD</button>
                <button data-action="toggle-shift" id="btn-shift" class="glass-btn btn-function rounded-xl p-2.5 text-xs sm:text-sm font-semibold">2nd</button>
                <button data-action="clear-all" class="glass-btn btn-action rounded-xl p-2.5 text-xs sm:text-sm font-semibold">AC</button>
                <button data-action="clear-entry" class="glass-btn btn-action rounded-xl p-2.5 text-xs sm:text-sm font-semibold">CE</button>
                <button data-action="backspace" class="glass-btn btn-action rounded-xl p-2.5 text-xs sm:text-sm"><i class="fas fa-backspace"></i></button>
                <button data-val="/" class="glass-btn btn-operator rounded-xl p-2.5 text-base sm:text-lg font-medium">÷</button>

                <!-- Row 2: Trig Functions -->
                <button data-val="sin(" data-shift-val="asin(" class="glass-btn btn-function rounded-xl p-2.5 text-xs sm:text-sm font-mono func-btn">sin</button>
                <button data-val="cos(" data-shift-val="acos(" class="glass-btn btn-function rounded-xl p-2.5 text-xs sm:text-sm font-mono func-btn">cos</button>
                <button data-val="tan(" data-shift-val="atan(" class="glass-btn btn-function rounded-xl p-2.5 text-xs sm:text-sm font-mono func-btn">tan</button>
                <button data-val="π" class="glass-btn rounded-xl p-2.5 text-xs sm:text-sm font-mono">π</button>
                <button data-val="e" class="glass-btn rounded-xl p-2.5 text-xs sm:text-sm font-mono">e</button>
                <button data-val="*" class="glass-btn btn-operator rounded-xl p-2.5 text-base sm:text-lg font-medium">×</button>

                <!-- Row 3: Powers & Roots -->
                <button data-val="^" data-shift-val="√" class="glass-btn btn-function rounded-xl p-2.5 text-xs sm:text-sm font-mono func-btn">x<sup>y</sup></button>
                <button data-val="^2" data-shift-val="^3" class="glass-btn btn-function rounded-xl p-2.5 text-xs sm:text-sm font-mono func-btn">x²</button>
                <button data-val="sqrt(" data-shift-val="cbrt(" class="glass-btn btn-function rounded-xl p-2.5 text-xs sm:text-sm font-mono func-btn">√</button>
                <button data-val="log(" data-shift-val="10^(" class="glass-btn btn-function rounded-xl p-2.5 text-xs sm:text-sm font-mono func-btn">log</button>
                <button data-val="ln(" data-shift-val="e^(" class="glass-btn btn-function rounded-xl p-2.5 text-xs sm:text-sm font-mono func-btn">ln</button>
                <button data-val="-" class="glass-btn btn-operator rounded-xl p-2.5 text-base sm:text-lg font-medium">−</button>

                <button data-val="abs(" class="glass-btn btn-function rounded-xl p-2.5 text-xs sm:text-sm font-mono">abs</button>

                <button data-val="8" class="glass-btn rounded-xl p-3 text-lg font-medium">8</button>
                <button data-val="9" class="glass-btn rounded-xl p-3 text-lg font-medium">9</button>
                <button data-val="(" class="glass-btn btn-operator rounded-xl p-2.5 text-sm font-mono">(</button>
                <button data-val="+" class="glass-btn btn-operator rounded-xl p-2.5 text-base sm:text-lg font-medium">+</button>

                <!-- Row 5: Digits & Basics -->
                <button data-val="!" class="glass-btn btn-function rounded-xl p-2.5 text-xs sm:text-sm font-mono">n!</button>
                <button data-val="4" class="glass-btn rounded-xl p-3 text-lg font-medium">4</button>
                <button data-val="5" class="glass-btn rounded-xl p-3 text-lg font-medium">5</button>
                <button data-val="6" class="glass-btn rounded-xl p-3 text-lg font-medium">6</button>
                <button data-val=")" class="glass-btn btn-operator rounded-xl p-2.5 text-sm font-mono">)</button>
                <button data-val="1/" class="glass-btn btn-function rounded-xl p-2.5 text-xs sm:text-sm font-mono">1/x</button>

                <!-- Row 6: Digits & Equals -->
                <button data-val="EE" class="glass-btn btn-function rounded-xl p-2.5 text-xs sm:text-sm font-mono">EXP</button>

                <button data-val="2" class="glass-btn rounded-xl p-3 text-lg font-medium">2</button>

                <button data-val="." class="glass-btn rounded-xl p-3 text-lg font-bold">.</button>
                <button data-val="ANS" class="glass-btn btn-function rounded-xl p-2.5 text-xs sm:text-sm font-mono">ANS</button>

            </div>

            <!-- Keyboard Hints -->
            <div class="mt-4 pt-3 border-t border-white/5 flex flex-wrap items-center justify-between text-[11px] text-slate-400 font-mono gap-2">
                <span><i class="fas fa-keyboard mr-1 opacity-70"></i> Keyboard Enabled</span>
                <span class="hidden sm:inline">Enter = Evaluate | Esc = AC | Backspace = Delete</span>
            </div>
        </div>

        <!-- History Sidebar / Panel -->
        <div id="history-panel" class="lg:col-span-4 glass-card rounded-3xl p-5 shadow-2xl h-full min-h-[400px] flex flex-col justify-between hidden lg:flex">
            <div>
                <div class="flex items-center justify-between mb-4 pb-3 border-b border-white/10">
                    <h2 class="text-sm font-semibold tracking-wider text-slate-200 uppercase flex items-center gap-2">
                        <i class="fas fa-history text-cyan-400"></i> Calculation Log
                    </h2>
                    <button id="clear-history-btn" class="text-xs text-slate-400 hover:text-red-400 transition-colors flex items-center gap-1">
                        <i class="fas fa-trash-alt"></i> Clear
                    </button>
                </div>

                <!-- History Entries List -->
                <div id="history-list" class="space-y-2.5 max-h-[480px] overflow-y-auto pr-1">
                    <div class="text-center py-10 text-slate-500 text-xs font-mono">
                        No previous calculations
                    </div>
                </div>
            </div>

            <!-- Quick Tip -->
            <div class="mt-4 p-3 rounded-xl bg-white/5 border border-white/5 text-xs text-slate-400 flex items-start gap-2">
                <i class="fas fa-info-circle text-blue-400 mt-0.5"></i>
                <span>Click any history item to instantly load its expression into the calculator display.</span>
            </div>
        </div>

    </div>

    <!-- JavaScript Logic -->
    <script>
        class ScientificCalculator {
            constructor() {
                this.expression = '';
                this.isDegMode = true;
                this.isShiftActive = false;
                this.lastAnswer = '0';
                this.history = [];

                // DOM Elements
                this.mainDisplay = document.getElementById('main-display');
                this.expressionDisplay = document.getElementById('expression-display');
                this.livePreview = document.getElementById('live-preview');
                this.degRadIndicator = document.getElementById('deg-rad-indicator');
                this.shiftIndicator = document.getElementById('shift-indicator');
                this.errorBadge = document.getElementById('error-badge');
                this.historyList = document.getElementById('history-list');

                this.init();
            }

            init() {
                this.attachEventListeners();
                this.updateDisplay();
            }

            attachEventListeners() {
                // Button Clicks
                document.querySelectorAll('button[data-val], button[data-action]').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.createRipple(e);
                        
                        const val = btn.dataset.val;
                        const action = btn.dataset.action;
                        const shiftVal = btn.dataset.shiftVal;

                        if (action) {
                            this.handleAction(action);
                        } else if (val) {
                            if (this.isShiftActive && shiftVal) {
                                this.append(shiftVal);
                                this.toggleShift(false);
                            } else {
                                this.append(val);
                            }
                        }
                    });
                });

                // Clear History Button
                document.getElementById('clear-history-btn').addEventListener('click', () => {
                    this.history = [];
                    this.renderHistory();
                });

                // Mobile history toggle
                const mobileHistBtn = document.getElementById('toggle-history-mobile');
                const historyPanel = document.getElementById('history-panel');
                if(mobileHistBtn) {
                    mobileHistBtn.addEventListener('click', () => {
                        historyPanel.classList.toggle('hidden');
                    });
                }

                // Keyboard Support
                window.addEventListener('keydown', (e) => this.handleKeyboardInput(e));
            }

            createRipple(event) {
                const button = event.currentTarget;
                const circle = document.createElement('span');
                const diameter = Math.max(button.clientWidth, button.clientHeight);
                const radius = diameter / 2;

                const rect = button.getBoundingClientRect();
                circle.style.width = circle.style.height = `${diameter}px`;
                circle.style.left = `${event.clientX - rect.left - radius}px`;
                circle.style.top = `${event.clientY - rect.top - radius}px`;
                circle.classList.add('ripple');

                const ripple = button.getElementsByClassName('ripple')[0];
                if (ripple) {
                    ripple.remove();
                }

                button.appendChild(circle);
            }

            handleAction(action) {
                switch(action) {
                    case 'clear-all':
                        this.expression = '';
                        this.hideError();
                        break;
                    case 'clear-entry':
                        this.expression = '';
                        break;
                    case 'backspace':
                        this.expression = this.expression.slice(0, -1);
                        this.hideError();
                        break;
                    case 'toggle-deg':
                        this.isDegMode = !this.isDegMode;
                        this.degRadIndicator.textContent = this.isDegMode ? 'DEG' : 'RAD';
                        break;
                    case 'toggle-shift':
                        this.toggleShift();
                        break;
                    case 'calculate':
                        this.evaluateExpression();
                        break;
                }
                this.updateDisplay();
            }

            toggleShift(forceState = null) {
                this.isShiftActive = forceState !== null ? forceState : !this.isShiftActive;
                const shiftBtn = document.getElementById('btn-shift');
                
                if (this.isShiftActive) {
                    this.shiftIndicator.classList.replace('text-slate-500', 'text-purple-400');
                    this.shiftIndicator.classList.replace('border-purple-500/10', 'border-purple-500/50');
                    this.shiftIndicator.classList.add('bg-purple-500/30');
                    shiftBtn.classList.add('btn-toggle-active');
                } else {
                    this.shiftIndicator.classList.replace('text-purple-400', 'text-slate-500');
                    this.shiftIndicator.classList.replace('border-purple-500/50', 'border-purple-500/10');
                    this.shiftIndicator.classList.remove('bg-purple-500/30');
                    shiftBtn.classList.remove('btn-toggle-active');
                }

                // Update text content of 2nd shiftable function keys
                document.querySelectorAll('.func-btn').forEach(btn => {
                    if (this.isShiftActive && btn.dataset.shiftVal) {
                        btn.innerHTML = btn.dataset.shiftVal.replace('(', '');
                    } else {
                        btn.innerHTML = btn.dataset.val.replace('(', '').replace('^2', 'x²').replace('^', 'x<sup>y</sup>');
                    }
                });
            }

            append(val) {
                this.hideError();
                if (val === 'ANS') {
                    this.expression += this.lastAnswer;
                } else {
                    this.expression += val;
                }
                this.updateDisplay();
            }

            updateDisplay() {
                this.mainDisplay.textContent = this.expression || '0';
                
                // Live preview computation
                if (this.expression.trim()) {
                    try {
                        const previewResult = this.compute(this.expression);
                        if (!isNaN(previewResult) && previewResult !== undefined) {
                            this.livePreview.textContent = `= ${this.formatNumber(previewResult)}`;
                        } else {
                            this.livePreview.textContent = '= ...';
                        }
                    } catch (e) {
                        this.livePreview.textContent = '';
                    }
                } else {
                    this.livePreview.textContent = '= 0';
                }
            }

            evaluateExpression() {
                if (!this.expression.trim()) return;

                try {
                    const result = this.compute(this.expression);
                    if (isNaN(result) || !isFinite(result)) {
                        throw new Error("Invalid Output");
                    }

                    const formattedResult = this.formatNumber(result);
                    
                    // Push to history
                    this.history.unshift({
                        expr: this.expression,
                        result: formattedResult
                    });

                    // Keep last 30 entries
                    if (this.history.length > 30) this.history.pop();
                    
                    this.renderHistory();

                    this.expressionDisplay.textContent = `${this.expression} =`;
                    this.lastAnswer = formattedResult;
                    this.expression = formattedResult;
                    this.updateDisplay();

                } catch (err) {
                    this.showError();
                }
            }

            showError() {
                this.errorBadge.classList.remove('hidden');
                this.livePreview.textContent = '';
            }

            hideError() {
                this.errorBadge.classList.add('hidden');
            }

            formatNumber(num) {
                if (typeof num !== 'number') return num;
                // Avoid tiny float inaccuracy (e.g., sin(pi) -> 0)
                if (Math.abs(num) < 1e-12) return '0';
                
                // Convert to precision limited format
                const parsed = parseFloat(num.toFixed(10));
                return parsed.toString();
            }

            // Math Parsing & Computation Engine
            compute(inputStr) {
                let parsed = inputStr;

                // Replace Constants
                parsed = parsed.replace(/π/g, 'Math.PI');
                parsed = parsed.replace(/\be\b/g, 'Math.E');

                // Custom Factorial Parser (e.g., 5! -> factorial(5))
                parsed = parsed.replace(/(\d+(\.\d+)?|\([^\)]+\))!/g, (match, p1) => {
                    return `this.factorial(${p1})`;
                });

                // Percentage support (e.g. 50% -> (50/100))
                parsed = parsed.replace(/(\d+(\.\d+)?)/g, '$1');
                parsed = parsed.replace(/%/g, '/100');

                // EXP notation (e.g. 5EE3 -> 5*10^(3))
                parsed = parsed.replace(/EE/g, '*10^');

                // Powers x^y
                parsed = parsed.replace(/\^/g, '**');

                // Square Root and Cube Root
                parsed = parsed.replace(/sqrt\(/g, 'Math.sqrt(');
                parsed = parsed.replace(/cbrt\(/g, 'Math.cbrt(');
                parsed = parsed.replace(/10\^\(/g, '10**(');
                parsed = parsed.replace(/e\^\(/g, 'Math.exp(');

                // Inverse 1/x replacement
                parsed = parsed.replace(/1\//g, '1/');

                // Log functions
                parsed = parsed.replace(/log\(/g, 'Math.log10(');
                parsed = parsed.replace(/ln\(/g, 'Math.log(');
                parsed = parsed.replace(/abs\(/g, 'Math.abs(');

                // Trigonometric replacements with DEG/RAD handling
                const degFactor = this.isDegMode ? '(Math.PI/180)*' : '';
                const radToDegFactor = this.isDegMode ? '(180/Math.PI)*' : '';

                parsed = parsed.replace(/asin\(/g, `${radToDegFactor}Math.asin(`);
                parsed = parsed.replace(/acos\(/g, `${radToDegFactor}Math.acos(`);
                parsed = parsed.replace(/atan\(/g, `${radToDegFactor}Math.atan(`);

                parsed = parsed.replace(/sin\(/g, `Math.sin(${degFactor}`);
                parsed = parsed.replace(/cos\(/g, `Math.cos(${degFactor}`);
                parsed = parsed.replace(/tan\(/g, `Math.tan(${degFactor}`);

                // Evaluate using safe Function constructor scope
                const fn = new Function('Math', `return ${parsed}`);
                return fn.call(this, Math);
            }

            factorial(n) {
                const num = Number(n);
                if (num < 0) return NaN;
                if (num === 0 || num === 1) return 1;
                let result = 1;
                for (let i = 2; i <= num; i++) {
                    result *= i;
                }
                return result;
            }

            renderHistory() {
                if (this.history.length === 0) {
                    this.historyList.innerHTML = `
                        <div class="text-center py-10 text-slate-500 text-xs font-mono">
                            No previous calculations
                        </div>`;
                    return;
                }

                this.historyList.innerHTML = this.history.map((item, idx) => `
                    <div data-idx="${idx}" class="history-item p-3 rounded-xl bg-white/5 border border-white/5 hover:border-cyan-500/30 hover:bg-white/10 cursor-pointer transition-all">
                        <div class="text-xs font-mono text-slate-400 text-right truncate">${item.expr} =</div>
                        <div class="text-sm font-mono text-cyan-400 font-semibold text-right truncate">${item.result}</div>
                    </div>
                `).join('');

                // Click event to restore calculation
                document.querySelectorAll('.history-item').forEach(el => {
                    el.addEventListener('click', () => {
                        const idx = el.dataset.idx;
                        const selected = this.history[idx];
                        if (selected) {
                            this.expression = selected.expr;
                            this.updateDisplay();
                        }
                    });
                });
            }

            handleKeyboardInput(e) {
                const key = e.key;

                if (key >= '0' && key <= '9') this.append(key);
                else if (key === '.') this.append('.');
                else if (key === '+') this.append('+');
                else if (key === '-') this.append('-');
                else if (key === '*') this.append('*');
                else if (key === '/') { e.preventDefault(); this.append('/'); }
                else if (key === '(') this.append('(');
                else if (key === ')') this.append(')');
                else if (key === '^') this.append('^');
                else if (key === '!') this.append('!');
                else if (key === 'Enter' || key === '=') { e.preventDefault(); this.evaluateExpression(); }
                else if (key === 'Backspace') { e.preventDefault(); this.handleAction('backspace'); }
                else if (key === 'Escape') { e.preventDefault(); this.handleAction('clear-all'); }
            }
        }

        // Initialize App on Window Load
        window.addEventListener('DOMContentLoaded', () => {
            window.calculator = new ScientificCalculator();
        });
    </script>
</body>
</html>
